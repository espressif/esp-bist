.test_device_template:
  stage: Test Device
  variables:
    REPORT_PATH: 'build/tests/${SOC_TARGET}_device_report.xml'
  script:
    - echo "Testing $TEST_APP_NAME"
    - cd tests/$TEST_APP_NAME
    - cmake -DSOC_TARGET=$SOC_TARGET -B build -GNinja
    - ninja -C build
    - ninja -C build flash_boot
    - pytest pytest_device* --executable=$TEST_APP_NAME --junitxml=$REPORT_PATH
  when: always
  retry: 1
  tags: [generic, $SOC_TARGET]
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - tests/$TEST_APP_NAME/$REPORT_PATH
    reports:
      junit: tests/$TEST_APP_NAME/$REPORT_PATH
  cache:
    - key: ${CI_COMMIT_REF_SLUG}_${CI_PIPELINE_ID}_${TEST_APP_NAME}
      paths:
        - tests/$TEST_APP_NAME/build

