.test_qemu_template:
  stage: Test Qemu
  variables:
    REPORT_PATH: 'build/tests/${SOC_TARGET}_qemu_report.xml'
  before_script:
    - . $IDF_PATH/export.sh
  script:
    - echo "Testing $TEST_APP_NAME"
    - cd tests/$TEST_APP_NAME
    - pytest pytest_qemu* --executable=$TEST_APP_NAME --junitxml=$REPORT_PATH
  when: always
  retry: 1
  tags: [build]
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - tests/$TEST_APP_NAME/$REPORT_PATH
    reports:
      junit: tests/$TEST_APP_NAME/$REPORT_PATH
  cache:
    - key: ${CI_COMMIT_REF_SLUG}_${CI_PIPELINE_ID}_${TEST_APP_NAME}
      paths:
        - tests/$TEST_APP_NAME/build

test_qemu_esp32c3_cpu_reg_test:
  extends:
    - .test_qemu_template
  needs: ["build_esp32c3_cpu_reg_test"]
  variables:
    TEST_APP_NAME: 'cpu_reg_test'
