build_zephyr_esp32c6_sample:
  stage: Build
  image: ghcr.io/zephyrproject-rtos/ci:latest
  before_script: []
  variables:
    ZEPHYR_WORKSPACE: "$CI_PROJECT_DIR/zephyr-workspace"
  script:
    - west init -m https://github.com/zephyrproject-rtos/zephyr.git "$ZEPHYR_WORKSPACE" || true
    - cd "$ZEPHYR_WORKSPACE"
    - west update --narrow -o=--depth=1
    - west zephyr-export
    - west build -p -b esp32c6_devkitc/esp32c6/hpcore "$CI_PROJECT_DIR/samples/zephyr" --sysbuild -D ZEPHYR_EXTRA_MODULES="$CI_PROJECT_DIR"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - zephyr-workspace/build/zephyr/zephyr.elf
  tags: [build]

.test_qemu_template:
  stage: Test Qemu
  variables:
    REPORT_PATH: 'build/tests/${SOC_TARGET}_qemu_report.xml'
  before_script:
    - . $IDF_PATH/export.sh
  script:
    - echo "Testing $TEST_APP_NAME"
    - cd tests/$TEST_APP_NAME
    - pytest pytest_qemu* --executable=$TEST_APP_NAME --soc-target=$SOC_TARGET --junitxml=$REPORT_PATH
  when: always
  retry: 1
  tags: [build]
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - tests/$TEST_APP_NAME/$REPORT_PATH
    reports:
      junit: tests/$TEST_APP_NAME/$REPORT_PATH
  cache:
    - key: ${CI_COMMIT_REF_SLUG}_${CI_PIPELINE_ID}_${SOC_TARGET}_${TEST_APP_NAME}
      paths:
        - tests/$TEST_APP_NAME/build

