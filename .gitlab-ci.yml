stages:
  - Build-Docker-Image
  - Build
  - Test Qemu
  - Test Device
  - Static-Analysis
  - Build Docs
  - Deploy Docs

default:
  image: $CI_DOCKER_REGISTRY/espressif/esp-bist/build-env
  before_script:
    - . $IDF_PATH/export.sh
    - echo "Building MCUboot for $SOC_TARGET"
    - cd $MCUBOOT_PATH/boot/espressif
    - cmake -DCMAKE_TOOLCHAIN_FILE=tools/toolchain-${SOC_TARGET}.cmake -DMCUBOOT_TARGET=${SOC_TARGET} -DESP_HAL_PATH=$IDF_PATH -B build -GNinja
    - ninja -C build
    - cd $CI_PROJECT_DIR


build_docker_image:
  before_script: []
  image: espressif/dind:1
  stage: Build-Docker-Image
  timeout: 4h
  variables:
    DOCKER_TLS_CERTDIR: ""
    IMAGE_NAME: espressif/esp-bist/build-env
    DOCKERFILE: .devcontainer/Dockerfile
  script:
    - mkdir -p config
    - echo ${DOCKER_AUTH_CONFIG} > config/config.json
    - docker --config=./config pull ${CI_DOCKER_REGISTRY}/${IMAGE_NAME} || true
    - docker --config=./config build --pull -t ${CI_DOCKER_REGISTRY}/${IMAGE_NAME} -f ${DOCKERFILE} .
    - docker run --rm -t ${CI_DOCKER_REGISTRY}/${IMAGE_NAME} /bin/bash -c "echo Hello Docker; exit 0"
    - docker --config=./config push ${CI_DOCKER_REGISTRY}/${IMAGE_NAME}
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - ${DOCKERFILE}
      when: manual
  tags: [ "dind", "shiny" ]

.build_template:
  stage: Build
  script:
    - echo "Building $ROOT_DIR/$TEST_APP_NAME"
    - cd $ROOT_DIR/$TEST_APP_NAME
    - cmake -DSOC_TARGET=$SOC_TARGET -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -B build -GNinja
    - ninja -C build
  when: always
  retry: 1
  tags: [build]
  cache:
    - key: ${CI_COMMIT_REF_SLUG}_${CI_PIPELINE_ID}_${SOC_TARGET}_${TEST_APP_NAME}
      paths:
        - $ROOT_DIR/$TEST_APP_NAME/build

