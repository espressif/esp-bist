stages:
  - Build-Docker-Image
  - Pre-Build
  - Build
  - Test Qemu
  - Test Device

default:
  image: $CI_DOCKER_REGISTRY/espressif/esp-bist/build-env
  before_script:
    - . $IDF_PATH/export.sh

build_docker_image:
  before_script: []
  image: espressif/dind:1
  stage: Build-Docker-Image
  timeout: 2h
  variables:
    DOCKER_TLS_CERTDIR: ""
    IMAGE_NAME: espressif/esp-bist/build-env
    DOCKERFILE: .gitlab/docker/build-env/Dockerfile
  script:
    - mkdir -p config
    - echo ${DOCKER_AUTH_CONFIG} > config/config.json
    - docker --config=./config pull ${CI_DOCKER_REGISTRY}/${IMAGE_NAME} || true
    - docker --config=./config build --pull -t ${CI_DOCKER_REGISTRY}/${IMAGE_NAME} -f ${DOCKERFILE} .
    - docker run --rm -t ${CI_DOCKER_REGISTRY}/${IMAGE_NAME} /bin/bash -c "echo Hello Docker; exit 0"
    - docker --config=./config push ${CI_DOCKER_REGISTRY}/${IMAGE_NAME}
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - ${DOCKERFILE}
      when: manual
  tags: [ "dind", "shiny" ]

init_submodules:
  stage: Pre-Build
  before_script: []
  script:
    - echo "Fetching submodules"
    - git submodule update --init --recursive
  when: always
  cache:
    key: ${CI_COMMIT_REF_SLUG}_${CI_PIPELINE_ID}_submodules
    paths:
      - modules
  tags: [build]

build_mcuboot:
  stage: Pre-Build
  needs:
    - init_submodules
  script:
    - echo "Building MCUboot"
    - cd modules/mcuboot/boot/espressif
    - cmake -DCMAKE_TOOLCHAIN_FILE=tools/toolchain-esp32c3.cmake -DMCUBOOT_TARGET=esp32c3 -DESP_HAL_PATH=$IDF_PATH -B build -GNinja
    - ninja -C build
  when: always
  retry: 1
  tags: [build]
  cache:
    key: ${CI_COMMIT_REF_SLUG}_${CI_PIPELINE_ID}_submodules
    paths:
      - modules
  artifacts:
      expire_in: 1 day
      paths:
        - modules/mcuboot/boot/espressif/build/

.build_template:
  stage: Build
  needs:
    - build_mcuboot
  script:
    - echo "Building $ROOT_DIR/$TEST_APP_NAME"
    - cd $ROOT_DIR/$TEST_APP_NAME
    - cmake -DSOC_TARGET=$SOC_TARGET -B build -GNinja
    - ninja -C build
  when: always
  retry: 1
  tags: [build]
  cache:
    - key: ${CI_COMMIT_REF_SLUG}_${CI_PIPELINE_ID}_${TEST_APP_NAME}
      paths:
        - $ROOT_DIR/$TEST_APP_NAME/build
    - key: ${CI_COMMIT_REF_SLUG}_${CI_PIPELINE_ID}_submodules
      paths:
        - modules

build_esp32c3_cpu_reg_test:
  extends:
    - .build_template
  variables:
    ROOT_DIR: 'tests'
    TEST_APP_NAME: 'cpu_reg_test'
    SOC_TARGET: 'esp32c3'

