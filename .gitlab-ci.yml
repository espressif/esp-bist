build_docs:
  stage: Build Docs
  image: $CI_DOCKER_REGISTRY/esp-idf-doc-env-v5.4:1-1
  before_script: []
  needs:
    - artifacts: true
      job: test_qemu_esp32c3_cpu_reg_test
    - artifacts: true
      job: test_qemu_esp32c3_cpu_stack_test
    - artifacts: true
      job: test_qemu_esp32c3_ram_test
    - artifacts: true
      job: test_qemu_esp32c3_flash_test
    - artifacts: true
      job: test_qemu_esp32c3_pc_test
    - artifacts: true
      job: test_qemu_esp32c3_wdt_test
    - artifacts: true
      job: test_device_esp32c3_cpu_reg_test
    - artifacts: true
      job: test_device_esp32c3_cpu_stack_test
    - artifacts: true
      job: test_device_esp32c3_ram_test
    - artifacts: true
      job: test_device_esp32c3_flash_test
    - artifacts: true
      job: test_device_esp32c3_pc_test
    - artifacts: true
      job: test_device_esp32c3_wdt_test
    - artifacts: true
      job: test_device_esp32c3_digital_io_test
  script:
    - cd docs
    - bash build.sh
    - cp _build/en/esp32c3/latex/build/esp-bist-en-master-esp32c3.pdf _build/en/esp32c3/html/esp-bist-en-master-esp32c3.pdf
    - cd ..
    - mkdir -p public
    - cp -r docs/_build/en/esp32c3/html/* public/
  artifacts:
    paths:
      - public
  pages: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: always
    - when: never
  tags: [build]
