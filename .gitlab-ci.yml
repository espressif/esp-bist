spec:
  inputs:
    build_docker_image:
      type: boolean
      default: false
      description: "Build and push the Docker CI image"
    use_mirror:
      type: boolean
      default: true
      description: "Use mirror sources to fetch data."
    build_qemu_remote:
      type: boolean
      default: false
      description: "Build Espressif QEMU and refresh the remote QEMU cache"

---

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

variables:
  USE_MIRROR: $[[ inputs.use_mirror ]]
  QEMU_CACHE_KEY: ${CI_COMMIT_REF_SLUG}-qemu-remote-riscv32
  QEMU_CACHE_KEY_SHARED: ${CI_DEFAULT_BRANCH}-qemu-remote-riscv32

stages:
  - Lint
  - Build
  - Test Qemu
  - Test Device
  - Static-Analysis
  - Build Docs
  - Deploy Docs

.get_qemu_repo: &get_qemu_repo |
  QEMU_PATH="idf/qemu.git"
  QEMU_REPO_SOURCE="https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/${QEMU_PATH}"
  QEMU_REPO_MIRROR="http://gitmirror.brew:6688/${CI_SERVER_HOST}:${CI_SERVER_PORT}/${QEMU_PATH}"
  if [ "${USE_MIRROR}" = "false" ]; then
    QEMU_REPO="${QEMU_REPO_SOURCE}"
  elif [ -n "${QEMU_REPO_MIRROR:-}" ]; then
    QEMU_REPO="${QEMU_REPO_MIRROR}"
  fi
  echo "QEMU_REPO: ${QEMU_REPO}"

.get_nuttx_repos: &get_nuttx_repos |
  LOCAL_GIT_MIRROR="http://gitmirror.brew:6688/${CI_SERVER_HOST}:${CI_SERVER_PORT}"
  NUTTX_OS_PATH="idf/apache/incubator-nuttx.git"
  NUTTX_APPS_PATH="idf/apache/incubator-nuttx-apps.git"
  ESP_HAL_PATH="espressif/esp-hal-3rdparty.git"
  NUTTX_OS_URL_SOURCE="https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/${NUTTX_OS_PATH}"
  NUTTX_APPS_URL_SOURCE="https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/${NUTTX_APPS_PATH}"
  ESP_HAL_3RDPARTY_URL_SOURCE="https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/${ESP_HAL_PATH}"
  NUTTX_OS_URL_MIRROR="${LOCAL_GIT_MIRROR}/${NUTTX_OS_PATH}"
  NUTTX_APPS_URL_MIRROR="${LOCAL_GIT_MIRROR}/${NUTTX_APPS_PATH}"
  ESP_HAL_3RDPARTY_URL_MIRROR="${LOCAL_GIT_MIRROR}/${ESP_HAL_PATH}"
  if [ "${USE_MIRROR}" = "false" ]; then
    NUTTX_OS_URL="${NUTTX_OS_URL_SOURCE}"
    NUTTX_APPS_URL="${NUTTX_APPS_URL_SOURCE}"
    ESP_HAL_3RDPARTY_URL="${ESP_HAL_3RDPARTY_URL_SOURCE}"
  else
    NUTTX_OS_URL="${NUTTX_OS_URL_MIRROR}"
    NUTTX_APPS_URL="${NUTTX_APPS_URL_MIRROR}"
    ESP_HAL_3RDPARTY_URL="${ESP_HAL_3RDPARTY_URL_MIRROR}"
  fi
  echo "NUTTX_OS_URL: ${NUTTX_OS_URL}"
  echo "NUTTX_APPS_URL: ${NUTTX_APPS_URL}"
  echo "ESP_HAL_3RDPARTY_URL: ${ESP_HAL_3RDPARTY_URL}"

.socs: &socs
  - esp32c3
  - esp32c5
  - esp32c6
  - esp32c61
  - esp32h2
  - esp32p4
  - esp32h4

.qemu_upstream_socs: &qemu_upstream_socs
  - esp32c3

.qemu_remote_socs: &qemu_remote_socs
  - esp32c5
  - esp32c6
  - esp32c61
  - esp32h2
  - esp32p4
  - esp32h4

.qemu_test_apps: &qemu_test_apps
  - cpu_reg_test
  - cpu_stack_test
  - ram_test
  - flash_test
  - pc_test
  - wdt_test
  - windowed_wdt_test
  - interrupt_test

.device_test_apps: &device_test_apps
  - cpu_reg_test
  - cpu_stack_test
  - ram_test
  - flash_test
  - pc_test
  - wdt_test
  - digital_io_test
  - analog_io_test
  - windowed_wdt_test
  - interrupt_test

default:
  image: $CI_DOCKER_REGISTRY/espressif/esp-bist/build-env-2
  before_script:
    - . $IDF_PATH/export.sh
    - mkdir -p $MCUBOOT_PATH/boot/espressif/build
    - cp mcuboot_build/mcuboot_${SOC_TARGET}.bin $MCUBOOT_PATH/boot/espressif/build/
  retry:
    max: 2
    when:
      - script_failure
      - runner_system_failure
      - stuck_or_timeout_failure

mcp_data_drift:
  stage: Lint
  image: $CI_DOCKER_REGISTRY/espressif/esp-bist/build-env-2
  before_script: []
  tags: [build]
  rules:
    - changes:
        - docs/en/**/*
        - src/bist/**/*.c
        - src/bist/**/*.h
        - src/bist/Kconfig*
        - "**/README.md"
        - mcp-server/ingest.py
        - mcp-server/requirements.txt
  script:
    - pip install --quiet -r mcp-server/requirements.txt
    - python mcp-server/ingest.py .
    - |
      DRIFT=$(git status --porcelain mcp-server/data/)
      if [ -n "$DRIFT" ]; then
        echo "=========================================================="
        echo "ERROR: mcp-server/data/ is out of date."
        echo ""
        echo "You changed content that the MCP server indexes (docs,"
        echo "headers, Kconfig, source files, or READMEs) but did not"
        echo "regenerate the pre-built JSON snapshot."
        echo ""
        echo "Run locally:"
        echo "  cd mcp-server"
        echo "  .venv/bin/python ingest.py .."
        echo ""
        echo "then commit the updated mcp-server/data/*.json files."
        echo "=========================================================="
        echo "$DRIFT"
        git --no-pager diff --stat mcp-server/data/ || true
        exit 1
      fi
    - echo "mcp-server/data/ is in sync with source content."

pre_commit:
  stage: Lint
  image: $CI_DOCKER_REGISTRY/espressif/esp-bist/build-env-2
  before_script: []
  variables:
    SKIP: "mcp-server-refresh"
  tags: [build]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        # Make sure the MR's base commit is fetched even on a shallow clone,
        # so pre-commit can diff against it below.
        GIT_FETCH_EXTRA_FLAGS: --prune --quiet --no-tags $CI_MERGE_REQUEST_DIFF_BASE_SHA
    - when: always
  script:
    - pip install --quiet pre-commit
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        echo "Running pre-commit on files changed in the merge request"
        pre-commit run --from-ref "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --to-ref "$CI_COMMIT_SHA"
      elif git rev-parse --verify -q HEAD~1 > /dev/null; then
        echo "Running pre-commit on files changed in commit $CI_COMMIT_SHA"
        pre-commit run --from-ref HEAD~1 --to-ref HEAD
      else
        echo "No parent commit available, skipping pre-commit"
        exit 0
      fi

# Host-native Host Diagnostics protocol / challenge unit tests (no DUT / IDF).
test_hd_protocol_unit:
  stage: Lint
  image: $CI_DOCKER_REGISTRY/espressif/esp-bist/build-env-2
  before_script: []
  tags: [build]
  rules:
    - when: always
  script:
    - cmake -S tests/unit/hd_protocol -B build/hd_protocol_test
    - cmake --build build/hd_protocol_test
    - ctest --test-dir build/hd_protocol_test --output-on-failure

# Host-native verdict tests for the LP companion state machine: a scripted fake
# agent plays every way a host can be wrong (bad value, replayed seq, wrong
# frame, silence, late answer) against the real companion code.
test_hd_companion_unit:
  stage: Lint
  image: $CI_DOCKER_REGISTRY/espressif/esp-bist/build-env-2
  before_script: []
  tags: [build]
  rules:
    - when: always
  script:
    - cmake -S tests/unit/hd_companion -B build/hd_companion_test
    - cmake --build build/hd_companion_test
    - ctest --test-dir build/hd_companion_test --output-on-failure

test_clock_math_unit:
  stage: Lint
  image: $CI_DOCKER_REGISTRY/espressif/esp-bist/build-env-2
  before_script: []
  tags: [build]
  rules:
    - when: always
  script:
    - cmake -S tests/unit/clock_math -B build/clock_math_test
    - cmake --build build/clock_math_test
    - ctest --test-dir build/clock_math_test --output-on-failure

build_docker_image:
  before_script: []
  image: espressif/dind:1
  stage: Build
  timeout: 4h
  variables:
    DOCKER_TLS_CERTDIR: ""
    IMAGE_NAME: espressif/esp-bist/build-env-2
    DOCKERFILE: .devcontainer/Dockerfile
  script:
    - mkdir -p config
    - echo ${DOCKER_AUTH_CONFIG} > config/config.json
    - docker --config=./config pull ${CI_DOCKER_REGISTRY}/${IMAGE_NAME} || true
    - docker --config=./config build --pull -t ${CI_DOCKER_REGISTRY}/${IMAGE_NAME} -f ${DOCKERFILE} .
    - docker run --rm -t ${CI_DOCKER_REGISTRY}/${IMAGE_NAME} /bin/bash -c "echo Hello Docker; exit 0"
    - docker --config=./config push ${CI_DOCKER_REGISTRY}/${IMAGE_NAME}
  allow_failure: true
  rules:
    - if: '"$[[ inputs.build_docker_image ]]" == "true"'
    - changes:
        - .devcontainer/Dockerfile
      when: manual
  tags: [ "dind", "shiny" ]

build_mcuboot:
  stage: Build
  before_script:
    - . $IDF_PATH/export.sh
  script:
    - echo "Building MCUboot for $SOC_TARGET"
    - cd $MCUBOOT_PATH/boot/espressif
    - cmake -DCMAKE_TOOLCHAIN_FILE=tools/toolchain-${SOC_TARGET}.cmake -DMCUBOOT_TARGET=${SOC_TARGET} -DESP_HAL_PATH=$IDF_PATH -B build -GNinja
    - ninja -C build
    - mkdir -p $CI_PROJECT_DIR/mcuboot_build
    - cp build/mcuboot_${SOC_TARGET}.bin $CI_PROJECT_DIR/mcuboot_build/
  parallel:
    matrix:
      - SOC_TARGET: *socs
  artifacts:
    paths:
      - mcuboot_build/
    expire_in: 1 week
  rules:
    - when: always
  tags: [build]

build_qemu_remote:
  stage: Build
  timeout: 2h
  variables:
    QEMU_BRANCH: 'feature/esp32h4'
  before_script:
    - . $IDF_PATH/export.sh
  script:
    - echo "Cloning QEMU from espressif/qemu at branch $QEMU_BRANCH"
    - *get_qemu_repo
    - cd /opt
    - git clone --depth=1 -b "${QEMU_BRANCH}" "${QEMU_REPO}"
    - cd qemu
    - mkdir build
    - cd build
    - ../configure --target-list=riscv32-softmmu
    - ninja
    - mkdir -p $CI_PROJECT_DIR/qemu_build/qemu-bundle/usr/local/share/qemu
    - cp qemu-system-riscv32 $CI_PROJECT_DIR/qemu_build/
    - cp -L ../pc-bios/esp32* $CI_PROJECT_DIR/qemu_build/qemu-bundle/usr/local/share/qemu/
  artifacts:
    paths:
      - qemu_build/
    expire_in: 1 week
  cache:
    key: $QEMU_CACHE_KEY
    paths:
      - qemu_build/
    policy: push
    unprotect: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: '"$[[ inputs.build_qemu_remote ]]" == "true"'
  tags: [build]

.build_template:
  stage: Build
  needs:
    - job: build_mcuboot
      artifacts: true
  script:
    - echo "Building $ROOT_DIR/$TEST_APP_NAME"
    - cd $ROOT_DIR/$TEST_APP_NAME
    - cmake -DSOC_TARGET=$SOC_TARGET -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -B build -GNinja
    - ninja -C build
  rules:
    - when: always
  tags: [build]
  cache:
    - key: ${CI_COMMIT_REF_SLUG}_${CI_PIPELINE_ID}_${SOC_TARGET}_${TEST_APP_NAME}
      paths:
        - $ROOT_DIR/$TEST_APP_NAME/build

.build_tests_matrix: &build_tests_matrix
  parallel:
    matrix:
      - SOC_TARGET: *socs
        TEST_APP_NAME: *device_test_apps

.build_samples_matrix: &build_samples_matrix
  parallel:
    matrix:
      - SOC_TARGET: *socs
        TEST_APP_NAME: ["standalone"]

.zephyr_boards_matrix: &zephyr_boards_matrix
  matrix:
    - ZEPHYR_BOARD: esp32c5_devkitc/esp32c5/hpcore
      SOC_TAG: esp32c5
    - ZEPHYR_BOARD: esp32c6_devkitc/esp32c6/hpcore
      SOC_TAG: esp32c6
    - ZEPHYR_BOARD: esp32p4x_function_ev_board/esp32p4/hpcore
      SOC_TAG: esp32p4

.nuttx_boards_matrix: &nuttx_boards_matrix
  matrix:
    - NUTTX_BOARD: esp32c6-devkitc
      NUTTX_CONFIG: ulp
      SOC_TAG: esp32c6
    - NUTTX_BOARD: esp32p4-function-ev-board
      NUTTX_CONFIG: ulp
      SOC_TAG: esp32p4

build_tests:
  extends:
    - .build_template
  variables:
    ROOT_DIR: 'tests'
  <<: *build_tests_matrix

build_samples:
  extends:
    - .build_template
  variables:
    ROOT_DIR: 'samples'
  <<: *build_samples_matrix

# One twister pass covers both roots: the Zephyr sample (happy path) and the
# Host Diagnostics fail-closed validation app. Splitting them would repeat the
# west/SDK setup, which dominates the job time.
build_zephyr_twister:
  stage: Build
  image: ghcr.io/zephyrproject-rtos/ci-repo-cache:v0.28.7.20251127
  before_script: []
  rules:
    - when: always
  parallel: *zephyr_boards_matrix
  variables:
    ZEPHYR_WORKSPACE: "$CI_PROJECT_DIR/zephyr-workspace"
    ZEPHYR_EXTRA_MODULES: "$CI_PROJECT_DIR"
  script:
    - west init -m https://github.com/zephyrproject-rtos/zephyr.git -o=--depth=1 "$ZEPHYR_WORKSPACE" || true
    - cd "$ZEPHYR_WORKSPACE"
    - west update -o=--depth=1 --narrow
        hal_espressif
        cmsis
        picolibc
        open-amp
        libmetal
        mcuboot
        mbedtls
    - west sdk install -t riscv64-zephyr-elf
    - west zephyr-export
    - west twister --prep-artifacts-for-testing -p $ZEPHYR_BOARD
        -T "$CI_PROJECT_DIR/samples/zephyr"
        -T "$CI_PROJECT_DIR/tests/integration/hd_zephyr"
        --outdir "$CI_PROJECT_DIR/twister-out"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - twister-out/
  tags: [build]

build_nuttx_samples:
  stage: Build
  image: $CI_DOCKER_REGISTRY/nuttx/build-env-v5.5-noidf
  before_script: []
  rules:
    - when: always
  parallel: *nuttx_boards_matrix
  variables:
    NUTTX_WORKSPACE: "$CI_PROJECT_DIR/nuttx-workspace"
    NUTTX_VERSION: master
    APPS_VERSION: master
    ESP_HAL_3RDPARTY_COMMIT: ""
  script:
    - *get_nuttx_repos
    - mkdir -p "$NUTTX_WORKSPACE"
    - |
      echo "Cloning NuttX OS (${NUTTX_VERSION}) from ${NUTTX_OS_URL}"
      git clone --depth 1 -b "$NUTTX_VERSION" "$NUTTX_OS_URL" "$NUTTX_WORKSPACE/nuttx"
      echo "Cloning NuttX apps (${APPS_VERSION}) from ${NUTTX_APPS_URL}"
      git clone --depth 1 -b "$APPS_VERSION" "$NUTTX_APPS_URL" "$NUTTX_WORKSPACE/apps"
    - ln -sfn "$CI_PROJECT_DIR/samples/nuttx" "$NUTTX_WORKSPACE/apps/external"
    - ls -la "$NUTTX_WORKSPACE/apps/external"
    - cd "$NUTTX_WORKSPACE/nuttx"
    - |
      CMAKE_ARGS="-DESP_HAL_3RDPARTY_URL=${ESP_HAL_3RDPARTY_URL}"
      if [ -n "$ESP_HAL_3RDPARTY_COMMIT" ]; then
        CMAKE_ARGS="$CMAKE_ARGS -DESP_HAL_3RDPARTY_VERSION=${ESP_HAL_3RDPARTY_COMMIT}"
      fi
      cmake -B build-bist -DBOARD_CONFIG=${NUTTX_BOARD}:${NUTTX_CONFIG} $CMAKE_ARGS -GNinja
    - kconfig-merge -m -O build-bist build-bist/.config
        "$CI_PROJECT_DIR/samples/nuttx/nuttx_bist/configs/espressif"
    - cmake --build build-bist -t olddefconfig
    - kconfig-merge -m -O build-bist build-bist/.config
        "$CI_PROJECT_DIR/samples/nuttx/nuttx_bist/configs/espressif"
    - cmake --build build-bist
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - nuttx-workspace/nuttx/build-bist/nuttx
      - nuttx-workspace/nuttx/build-bist/nuttx.bin
      - nuttx-workspace/nuttx/build-bist/nuttx.merged.bin
  tags: [build]

.idf_samples_matrix: &idf_samples_matrix
  matrix:
    - IDF_TARGET: esp32c6
    - IDF_TARGET: esp32c5
    - IDF_TARGET: esp32p4

.build_idf_sample_template:
  stage: Build
  before_script:
    - . $IDF_PATH/export.sh
  script:
    - cd $IDF_PATH && git apply $CI_PROJECT_DIR/samples/idf/patches/idf_ulp_linker.patch
    - cd $CI_PROJECT_DIR/samples/idf
    - idf.py -B build_${IDF_TARGET} set-target $IDF_TARGET
    - idf.py -B build_${IDF_TARGET} build
  rules:
    - when: always
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - samples/idf/build_${IDF_TARGET}/
  tags: [build]

build_idf_samples:
  extends: .build_idf_sample_template
  parallel: *idf_samples_matrix

# Host Diagnostics fail-closed validation app. Each config selects a different
# way for the host to misbehave; the ESP-BIST library is built as a product would
# build it, so the two images differ only in tests/integration/hd_idf.
.build_idf_hd_test_template:
  stage: Build
  before_script:
    - . $IDF_PATH/export.sh
  script:
    - cd $IDF_PATH && git apply $CI_PROJECT_DIR/samples/idf/patches/idf_ulp_linker.patch
    - cd $CI_PROJECT_DIR/tests/integration/hd_idf
    - idf.py -B build_${IDF_TARGET}_hd_key_mismatch -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ci.hd_key_mismatch" set-target $IDF_TARGET
    - idf.py -B build_${IDF_TARGET}_hd_key_mismatch build
    - idf.py -B build_${IDF_TARGET}_hd_starved_agent -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ci.hd_starved_agent" set-target $IDF_TARGET
    - idf.py -B build_${IDF_TARGET}_hd_starved_agent build
  rules:
    - when: always
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - tests/integration/hd_idf/build_${IDF_TARGET}_hd_key_mismatch/
      - tests/integration/hd_idf/build_${IDF_TARGET}_hd_starved_agent/
  tags: [build]

build_idf_hd_tests:
  extends: .build_idf_hd_test_template
  parallel: *idf_samples_matrix

.test_idf_device_template:
  stage: Test Device
  variables:
    REPORT_PATH: 'build_${IDF_TARGET}/idf_sample_${IDF_TARGET}_device_report.xml'
  before_script:
    - . $IDF_PATH/export.sh
    - cd $IDF_PATH && git apply $CI_PROJECT_DIR/samples/idf/patches/idf_ulp_linker.patch || true
  script:
    - cd $CI_PROJECT_DIR/samples/idf
    - pytest pytest_device* --target=$IDF_TARGET --junitxml=$REPORT_PATH --reruns 2
  rules:
    - when: always
  tags: [generic, $IDF_TARGET]
  needs:
    - job: build_idf_samples
      parallel: *idf_samples_matrix
      artifacts: true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - samples/idf/build_*/*_device_report.xml
    reports:
      junit: samples/idf/build_*/*_device_report.xml

test_idf_device:
  extends: .test_idf_device_template
  parallel: *idf_samples_matrix

.test_idf_hd_device_template:
  stage: Test Device
  variables:
    REPORT_PATH: 'tests/integration/hd_idf/hd_idf_${IDF_TARGET}_device_report.xml'
  before_script:
    - . $IDF_PATH/export.sh
    - cd $IDF_PATH && git apply $CI_PROJECT_DIR/samples/idf/patches/idf_ulp_linker.patch || true
  script:
    - cd $CI_PROJECT_DIR/tests/integration/hd_idf
    - pytest pytest_device* --target=$IDF_TARGET --junitxml=$CI_PROJECT_DIR/$REPORT_PATH --reruns 2
  rules:
    - when: always
  tags: [generic, $IDF_TARGET]
  needs:
    - job: build_idf_hd_tests
      parallel: *idf_samples_matrix
      artifacts: true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - tests/integration/hd_idf/*_device_report.xml
    reports:
      junit: tests/integration/hd_idf/*_device_report.xml

test_idf_hd_device:
  extends: .test_idf_hd_device_template
  parallel: *idf_samples_matrix

.test_qemu_template:
  stage: Test Qemu
  variables:
    REPORT_PATH: 'build/tests/${SOC_TARGET}_qemu_report.xml'
  before_script:
    - . $IDF_PATH/export.sh
  script:
    - echo "Testing $TEST_APP_NAME"
    - cd tests/$TEST_APP_NAME
    - pytest pytest_qemu* --executable=$TEST_APP_NAME --target=$SOC_TARGET --junitxml=$REPORT_PATH --reruns 2
  rules:
    - when: always
  tags: [build]
  needs:
    - job: build_tests
      parallel:
        matrix:
          - SOC_TARGET: *qemu_upstream_socs
            TEST_APP_NAME: *qemu_test_apps
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - tests/$TEST_APP_NAME/$REPORT_PATH
    reports:
      junit: tests/$TEST_APP_NAME/$REPORT_PATH
  cache:
    - key: ${CI_COMMIT_REF_SLUG}_${CI_PIPELINE_ID}_${SOC_TARGET}_${TEST_APP_NAME}
      paths:
        - tests/$TEST_APP_NAME/build

.test_qemu_template_remote:
  stage: Test Qemu
  variables:
    REPORT_PATH: 'build/tests/${SOC_TARGET}_qemu_report.xml'
  before_script:
    - . $IDF_PATH/export.sh
    - |
      if [ ! -x "$CI_PROJECT_DIR/qemu_build/qemu-system-riscv32" ]; then
        echo "QEMU binary missing under qemu_build/."
        exit 1
      fi
  script:
    - echo "Adding QEMU to PATH"
    - export PATH=$CI_PROJECT_DIR/qemu_build:$PATH
    - echo "Testing $TEST_APP_NAME"
    - cd tests/$TEST_APP_NAME
    - pytest pytest_qemu* --executable=$TEST_APP_NAME --target=$SOC_TARGET --junitxml=$REPORT_PATH --reruns 2
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      needs: [build_qemu_remote]
    - if: '"$[[ inputs.build_qemu_remote ]]" == "true"'
      needs: [build_qemu_remote]
    - when: always
  tags: [build]
  needs:
    - job: build_tests
      parallel:
        matrix:
          - SOC_TARGET: *qemu_remote_socs
            TEST_APP_NAME: *qemu_test_apps
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - tests/$TEST_APP_NAME/$REPORT_PATH
    reports:
      junit: tests/$TEST_APP_NAME/$REPORT_PATH
  cache:
    - key: $QEMU_CACHE_KEY
      fallback_keys:
        - $QEMU_CACHE_KEY_SHARED
      paths:
        - qemu_build/
      policy: pull
      unprotect: true
    - key: ${CI_COMMIT_REF_SLUG}_${CI_PIPELINE_ID}_${SOC_TARGET}_${TEST_APP_NAME}
      paths:
        - tests/$TEST_APP_NAME/build

.test_qemu_upstream_matrix: &test_qemu_upstream_matrix
  parallel:
    matrix:
      - SOC_TARGET: *qemu_upstream_socs
        TEST_APP_NAME: *qemu_test_apps

test_qemu_upstream:
  extends:
    - .test_qemu_template
  <<: *test_qemu_upstream_matrix

.test_qemu_remote_matrix: &test_qemu_remote_matrix
  parallel:
    matrix:
      - SOC_TARGET: *qemu_remote_socs
        TEST_APP_NAME: *qemu_test_apps

test_qemu_remote:
  extends:
    - .test_qemu_template_remote
  <<: *test_qemu_remote_matrix

.test_device_template:
  stage: Test Device
  variables:
    REPORT_PATH: 'build/tests/${SOC_TARGET}_device_report.xml'
  script:
    - echo "Testing $TEST_APP_NAME"
    - cd tests/$TEST_APP_NAME
    - cmake -DSOC_TARGET=$SOC_TARGET -B build -GNinja
    - ninja -C build
    - ninja -C build flash_boot
    - pytest pytest_device* --executable=$TEST_APP_NAME --target=$SOC_TARGET --junitxml=$REPORT_PATH --reruns 2
  rules:
    - when: always
  tags: [generic, $SOC_TARGET]
  needs:
    - job: build_mcuboot
      artifacts: true
    - job: build_tests
      parallel:
        matrix:
          - SOC_TARGET: *socs
            TEST_APP_NAME: *device_test_apps
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - tests/$TEST_APP_NAME/$REPORT_PATH
    reports:
      junit: tests/$TEST_APP_NAME/$REPORT_PATH
  cache:
    - key: ${CI_COMMIT_REF_SLUG}_${CI_PIPELINE_ID}_${SOC_TARGET}_${TEST_APP_NAME}
      paths:
        - tests/$TEST_APP_NAME/build

.test_device_matrix: &test_device_matrix
  parallel:
    matrix:
      - SOC_TARGET: *socs
        TEST_APP_NAME: *device_test_apps

test_device:
  extends:
    - .test_device_template
  <<: *test_device_matrix

.test_zephyr_device_template:
  stage: Test Device
  image: ${CI_DOCKER_REGISTRY}/zephyr-ci
  before_script: []
  timeout: 2h
  variables:
    ZEPHYR_WORKSPACE: "$CI_PROJECT_DIR/zephyr-workspace"
  script:
    - west init -m https://github.com/zephyrproject-rtos/zephyr.git -o=--depth=1 "$ZEPHYR_WORKSPACE" || true
    - cd "$ZEPHYR_WORKSPACE"
    - pip3 install --break-system-packages --ignore-installed -r "$ZEPHYR_WORKSPACE/zephyr/scripts/requirements.txt"
    - pip3 install --break-system-packages --ignore-installed -r "$ZEPHYR_WORKSPACE/zephyr/scripts/requirements-actions.txt" --require-hashes
    - west zephyr-export
    - west twister -p $ZEPHYR_BOARD
        --test-only --no-clean
        --device-testing --flash-before --log-level=DEBUG
        -T "$CI_PROJECT_DIR/samples/zephyr"
        -T "$CI_PROJECT_DIR/tests/integration/hd_zephyr"
        --outdir "$CI_PROJECT_DIR/twister-out"
        --device-serial=$ESPPORT
        --west-flash=--skip-rebuild
        --west-runner esp32
  rules:
    - when: always
  tags: [generic, $SOC_TAG]
  needs:
    - job: build_zephyr_twister
      artifacts: true
      parallel:
        matrix:
          - ZEPHYR_BOARD: ['$[[ matrix.ZEPHYR_BOARD ]]']
            SOC_TAG: ['$[[ matrix.SOC_TAG ]]']
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - twister-out/twister.xml
    reports:
      junit: twister-out/twister.xml

test_zephyr_device:
  extends:
    - .test_zephyr_device_template
  parallel: *zephyr_boards_matrix

.test_nuttx_device_template:
  stage: Test Device
  image: $CI_DOCKER_REGISTRY/nuttx/build-env-v5.5-noidf
  before_script: []
  timeout: 1h
  variables:
    REPORT_PATH: 'nuttx_${SOC_TAG}_device_report.xml'
    NUTTX_BIN: 'nuttx-workspace/nuttx/build-bist/nuttx.merged.bin'
  script:
    - |
      if [ -z "${ESPPORT}" ]; then
        echo "ESPPORT is not set on this runner"
        exit 1
      fi
      echo "Flashing NuttX BIST sample to ${ESPPORT} (${SOC_TAG})"
      esptool --chip "${SOC_TAG}" -p "${ESPPORT}" -b 921600 \
        write-flash -fs detect -fm dio 0x0 "${NUTTX_BIN}"
    - cd "$CI_PROJECT_DIR/samples/nuttx"
    - pytest pytest_device* --port=$ESPPORT --baud=115200
        --junitxml=$REPORT_PATH
  rules:
    - when: always
  tags: [generic, $SOC_TAG]
  needs:
    - job: build_nuttx_samples
      artifacts: true
      parallel:
        matrix:
          - NUTTX_BOARD: ['$[[ matrix.NUTTX_BOARD ]]']
            NUTTX_CONFIG: ['$[[ matrix.NUTTX_CONFIG ]]']
            SOC_TAG: ['$[[ matrix.SOC_TAG ]]']
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - samples/nuttx/*_device_report.xml
    reports:
      junit: samples/nuttx/*_device_report.xml

test_nuttx_device:
  extends:
    - .test_nuttx_device_template
  parallel: *nuttx_boards_matrix

