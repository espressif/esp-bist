CONFIG_MBOX=y
CONFIG_ESP32_ULP_COPROC_ENABLED=y
# Host Diagnostic Agent (HP side). LP runs the companion STL; HP compiles
# CPU/CSR STL slices when the matching HD audit is enabled.
CONFIG_ESP_BIST_HOST_DIAGNOSTICS=y
CONFIG_ESP_BIST_HD_AUDIT_QA=y
CONFIG_ESP_BIST_HD_AUDIT_CHECKPOINT=y
CONFIG_ESP_BIST_HD_AUDIT_IRQ_LATENCY=y
CONFIG_ESP_BIST_HD_AUDIT=y
CONFIG_ESP_BIST_HD_AUDIT_CPU=y
CONFIG_ESP_BIST_HD_AUDIT_CSR=y
