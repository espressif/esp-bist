# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
exclude: '^mcp-server/data/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ['-f=lf']
      - id: check-yaml
        args: ['--allow-multiple-documents']
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'master']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
        args: ['--fix', '--show-fixes']
      - id: ruff-format

  - repo: https://github.com/espressif/astyle_py.git
    rev: v1.1.0
    hooks:
      - id: astyle_py
        args:
          - '--astyle-version=3.4.7'
          - '--style=otbs'
          - '--attach-namespaces'
          - '--attach-classes'
          - '--indent=spaces=4'
          - '--convert-tabs'
          - '--align-reference=name'
          - '--keep-one-line-statements'
          - '--pad-header'
          - '--pad-oper'
          - '--unpad-paren'
          - '--max-continuation-indent=120'
        exclude: |
          (?x)^(
            samples/nuttx/|
            samples/zephyr/|
            tests/integration/hd_zephyr/|
            src/bist/companion/zephyr/|
            src/bist/companion/nuttx/|
            src/bist/host/zephyr/|
            src/bist/host/nuttx/
          )

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        additional_dependencies: [tomli]
        exclude: |
          (?x)^(
            .+\.(map|bin|svd)|
            scripts/misra_rules\.txt|
            mcp-server/data/.+
          )$
        args: ['-w']

  - repo: https://github.com/espressif/conventional-precommit-linter
    rev: v1.11.0
    hooks:
      - id: conventional-precommit-linter
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: mcp-server-refresh
        name: Refresh MCP server data
        entry: scripts/mcp_server_refresh.sh
        language: script
        pass_filenames: false
