CONFIG_ZTEST=y
CONFIG_MBOX=y
CONFIG_ESP32_ULP_COPROC_ENABLED=y
# Host Diagnostic Agent (HP side); the STL itself runs on the LP core.
CONFIG_ESP_BIST_HOST_DIAGNOSTICS=y
CONFIG_ESP_BIST_HD_AUDIT_QA=y
# Demote the agent so the starving app (K_PRIO_COOP(0)) strictly outranks it.
CONFIG_ESP_BIST_HD_AGENT_THREAD_COOP_PRIO=1
